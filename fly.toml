# fly.toml app configuration file generated for king-ai-ops-hub-staging on 2026-07-25T07:46:24-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'king-ai-ops-hub-staging'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'npm run db:migrate'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[processes]
  web = 'node server.js'
  worker = 'npm run worker'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1
  processes = ['web']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['web', 'worker']
