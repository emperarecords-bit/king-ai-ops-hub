# Sign staging backup receipt — MANUAL, off-machine producer of a G-Backup receipt-v2 for the staging release gate.
#
# This workflow ONLY signs + self-verifies a receipt from operator-supplied release facts and uploads the signed
# receipt as an artifact. It performs NO Fly, snapshot, migration, or deployment action, and it never publishes to
# the final HTTPS receipt endpoint. The private signing key is materialized from a GitHub Environment secret, used
# only to sign, and is never printed, written to disk, or uploaded (a static test + a runtime scan enforce this).
#
# Trigger: workflow_dispatch ONLY (never push / pull_request / schedule / repository_dispatch / pull_request_target).

name: Sign staging backup receipt

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Exact source commit to check out and sign (must be an ancestor of protected main).'
        required: true
        type: string
      target_image_ref:
        description: 'Digest-bound image reference (…@sha256:<64hex>) the release will run.'
        required: true
        type: string
      target_image_digest:
        description: 'The sha256:<64hex> image digest (must match the digest bound into target_image_ref).'
        required: true
        type: string
      deployment_nonce:
        description: 'Canonical 128-bit deployment nonce (hex32 or unpadded base64url22).'
        required: true
        type: string
      database_system_identifier:
        description: 'PostgreSQL system identifier (pg_control_system) of the staging DB — nonzero uint64 decimal.'
        required: true
        type: string
      snapshot_id:
        description: 'Fly volume snapshot id (vs_…) established by the external controller.'
        required: true
        type: string
      snapshot_requested_at:
        description: 'Snapshot request time (canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ).'
        required: true
        type: string
      snapshot_created_at:
        description: 'Snapshot creation time (canonical UTC).'
        required: true
        type: string
      provider_observed_at:
        description: 'Provider-observed time (canonical UTC); requested ≤ created ≤ observed.'
        required: true
        type: string
      receipt_created_at:
        description: 'Receipt creation time (canonical UTC); observed ≤ created.'
        required: true
        type: string
      expires_at:
        description: 'Receipt expiry (canonical UTC); must be after the intended migration start.'
        required: true
        type: string
      retention_days:
        description: 'Snapshot retention in days (integer, ≥ 7).'
        required: true
        type: string
      snapshot_discovery_method:
        description: 'How the snapshot was identified.'
        required: true
        type: choice
        options:
          - create-response-id
          - unambiguous-list-diff
      create_response_snapshot_id:
        description: '(create-response-id) the snapshot id returned by the create call (vs_…). Leave blank otherwise.'
        required: false
        type: string
      pre_request_set_digest:
        description: '(unambiguous-list-diff) sha256 of the pre-request snapshot-id set. Leave blank otherwise.'
        required: false
        type: string
      post_request_set_digest:
        description: '(unambiguous-list-diff) sha256 of the post-request snapshot-id set. Leave blank otherwise.'
        required: false
        type: string
      stored_size_bytes:
        description: 'Optional snapshot stored size in bytes (integer). Leave blank for null.'
        required: false
        type: string
      key_id:
        description: 'Trusted deployment-receipt key id (matches the trust-bundle entry).'
        required: true
        type: string
      applied_count:
        description: 'Migrations already applied to staging (EXPLICIT; never defaulted - read it from the live DB at ceremony time). Pending = the rest.'
        required: true
        type: string
      receipt_mode:
        description: 'artifact-only uploads the signed receipt and stops. sign-and-publish ALSO writes it create-only to the WORM receipt origin inside this same approved run, so one approval covers the whole ceremony.'
        required: true
        default: artifact-only
        type: choice
        options:
          - artifact-only
          - sign-and-publish

# Least privilege: read-only repository token. No packages, deployments, or id-token.
permissions:
  contents: read

concurrency:
  group: sign-staging-receipt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    name: sign-staging-receipt
    runs-on: ubuntu-latest
    # Only ever run in the canonical repository (never a fork), and bind the signing secret to the staging
    # Environment so its reviewer/approval protection (configured in repo settings) gates every run.
    if: github.repository == 'emperarecords-bit/king-ai-ops-hub'
    environment: staging
    timeout-minutes: 15
    steps:
      # 1. TRUSTED checkout: the reviewed signer + CLI from the WORKFLOW's own revision (not the selected source).
      #    This is the ONLY code executed with the signing secret. No secret is available in this or any step below
      #    except the single signing step. Full history so the selected source commit (an ancestor of main) is present.
      - name: Checkout trusted workflow code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source_commit + verify it is an ancestor of protected main
        env:
          SRC: ${{ inputs.source_commit }}
        run: |
          if ! printf '%s' "$SRC" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source_commit must be a full 40-hex commit SHA"; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$SRC" origin/main; then
            echo "::error::source_commit is not an ancestor of protected main"; exit 1
          fi
          echo "source_commit $SRC is an ancestor of protected main"

      # 2. DATA-ONLY checkout of the SELECTED source into a separate directory. We read ONLY its migration files;
      #    we NEVER run npm, package lifecycle scripts, repository scripts, or binaries from it. A git worktree
      #    (from the trusted checkout's already-fetched history) avoids a second network fetch.
      - name: Materialize selected source (data only — no code executed from it)
        env:
          SRC: ${{ inputs.source_commit }}
        run: |
          git worktree add --detach selected-source "$SRC"
          echo "selected-source checked out at $SRC (drizzle files only will be read)"

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '20'
          cache: npm

      # Install deps from the TRUSTED lockfile only (never from the selected source).
      - name: Install dependencies (from trusted lockfile)
        run: npm ci

      - name: Sign + self-verify the staging receipt (no Fly / snapshot / migration / deploy)
        env:
          # Private signing key — materialized from the staging Environment secret, base64-encoded PKCS#8 PEM.
          # Referenced ONLY by this single first-party step; used only to sign; never printed, written, or uploaded.
          GBACKUP_SIGNING_KEY_PEM_B64: ${{ secrets.GBACKUP_RECEIPT_SIGNING_KEY_B64 }}
          OUTPUT_DIR: ${{ github.workspace }}/receipt-out
          # The reviewed signer runs from the trusted workspace (cwd) and reads migration FILES from SOURCE_DIR; the
          # portable Git-blob hash is read from SOURCE_COMMIT in the trusted workspace's git.
          SOURCE_DIR: ${{ github.workspace }}/selected-source
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TARGET_IMAGE_REF: ${{ inputs.target_image_ref }}
          TARGET_IMAGE_DIGEST: ${{ inputs.target_image_digest }}
          DEPLOYMENT_NONCE: ${{ inputs.deployment_nonce }}
          DATABASE_SYSTEM_IDENTIFIER: ${{ inputs.database_system_identifier }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          SNAPSHOT_REQUESTED_AT: ${{ inputs.snapshot_requested_at }}
          SNAPSHOT_CREATED_AT: ${{ inputs.snapshot_created_at }}
          PROVIDER_OBSERVED_AT: ${{ inputs.provider_observed_at }}
          RECEIPT_CREATED_AT: ${{ inputs.receipt_created_at }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          RETENTION_DAYS: ${{ inputs.retention_days }}
          SNAPSHOT_DISCOVERY_METHOD: ${{ inputs.snapshot_discovery_method }}
          CREATE_RESPONSE_SNAPSHOT_ID: ${{ inputs.create_response_snapshot_id }}
          PRE_REQUEST_SET_DIGEST: ${{ inputs.pre_request_set_digest }}
          POST_REQUEST_SET_DIGEST: ${{ inputs.post_request_set_digest }}
          STORED_SIZE_BYTES: ${{ inputs.stored_size_bytes }}
          KEY_ID: ${{ inputs.key_id }}
          APPLIED_COUNT: ${{ inputs.applied_count }}
        run: npx tsx scripts/ci/sign-staging-receipt.ts

      - name: Assert no private-key material in the outputs
        run: |
          if grep -rlZ "PRIVATE KEY" receipt-out 2>/dev/null | grep -qz .; then
            echo "::error::private-key material found in receipt-out"; exit 1
          fi
          echo "no private-key material in receipt-out"

      - name: Upload signed receipt + public trust bundle (public material only)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: staging-receipt-v2
          path: |
            receipt-out/staging-receipt.v2.json
            receipt-out/trust-bundle.public.json
            receipt-out/verification-metadata.json
          if-no-files-found: error
          retention-days: 7

      # 5. OPTIONAL SAME-RUN PUBLICATION (receipt_mode: sign-and-publish).
      #
      #    WHY THIS EXISTS. publishSignedReceiptV2 substitutes the real publish clock for migrationStartedAt and
      #    re-checks the freshness window, so publication is itself on the snapshot's clock. Routing it through the
      #    standalone publish-staging-receipt.yml costs a SECOND human approval, and the snapshot keeps ageing
      #    between the two clicks — observed single-click latencies of 23 and 65 minutes made the two-gate ceremony
      #    unable to finish inside its own window. Publishing from the already-approved signing job removes the
      #    second gate entirely: one approval now covers signing and publication.
      #
      #    PROVENANCE IS STRICTLY STRONGER HERE. The standalone path authenticates a cross-run artifact (gh api run
      #    lookup + download-artifact, needing actions: read and the Actions token). In this job the receipt was just
      #    produced by the reviewed signer in the same workspace, so there is no artifact to authenticate, no extra
      #    permission scope, and no third-party download action.
      #
      #    CREDENTIAL SEPARATION. These steps carry ONLY the dedicated least-privilege receipt-publish credential.
      #    The Ed25519 signing key is step-scoped to the signing step above and is not in scope here; conversely the
      #    publish credential is not in scope for the signing step. Both directions are asserted in
      #    tests/unit/sign-staging-receipt-workflow.test.ts.
      - name: Publish receipt (create-only) + anonymous read-back verification
        if: inputs.receipt_mode == 'sign-and-publish'
        env:
          # The receipt signed moments ago by this same job (never a downloaded artifact).
          RECEIPT_FILE: ${{ github.workspace }}/receipt-out/staging-receipt.v2.json
          SOURCE_DIR: ${{ github.workspace }}/selected-source
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TARGET_IMAGE_REF: ${{ inputs.target_image_ref }}
          TARGET_IMAGE_DIGEST: ${{ inputs.target_image_digest }}
          DEPLOYMENT_NONCE: ${{ inputs.deployment_nonce }}
          DATABASE_SYSTEM_IDENTIFIER: ${{ inputs.database_system_identifier }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          # The real controller-established timestamps, exactly as signed. The standalone workflow omits these and
          # hardcodes the discovery method, which is survivable only because the verifier reads both from the
          # receipt itself; passing the true values keeps this step's expectation identical to the signer's.
          SNAPSHOT_REQUESTED_AT: ${{ inputs.snapshot_requested_at }}
          SNAPSHOT_CREATED_AT: ${{ inputs.snapshot_created_at }}
          PROVIDER_OBSERVED_AT: ${{ inputs.provider_observed_at }}
          RECEIPT_CREATED_AT: ${{ inputs.receipt_created_at }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          RETENTION_DAYS: ${{ inputs.retention_days }}
          SNAPSHOT_DISCOVERY_METHOD: ${{ inputs.snapshot_discovery_method }}
          CREATE_RESPONSE_SNAPSHOT_ID: ${{ inputs.create_response_snapshot_id }}
          PRE_REQUEST_SET_DIGEST: ${{ inputs.pre_request_set_digest }}
          POST_REQUEST_SET_DIGEST: ${{ inputs.post_request_set_digest }}
          STORED_SIZE_BYTES: ${{ inputs.stored_size_bytes }}
          KEY_ID: ${{ inputs.key_id }}
          APPLIED_COUNT: ${{ inputs.applied_count }}
          # Existing PUBLIC verification config (non-secret) — the gate's locator base + host allowlist + trust bundle.
          GBACKUP_RECEIPT_BASE_URL: ${{ vars.GBACKUP_RECEIPT_BASE_URL }}
          GBACKUP_RECEIPT_HOSTS: ${{ vars.GBACKUP_RECEIPT_HOSTS }}
          GBACKUP_RECEIPT_TRUST_BUNDLE: ${{ vars.GBACKUP_RECEIPT_TRUST_BUNDLE }}
          # DEDICATED least-privilege receipt-publish credential — NEVER the app AWS_* / VER-002 storage credential.
          GBACKUP_RECEIPT_S3_ACCESS_KEY_ID: ${{ secrets.GBACKUP_RECEIPT_S3_ACCESS_KEY_ID }}
          GBACKUP_RECEIPT_S3_SECRET_ACCESS_KEY: ${{ secrets.GBACKUP_RECEIPT_S3_SECRET_ACCESS_KEY }}
          GBACKUP_RECEIPT_S3_ENDPOINT: ${{ secrets.GBACKUP_RECEIPT_S3_ENDPOINT }}
          GBACKUP_RECEIPT_S3_REGION: ${{ secrets.GBACKUP_RECEIPT_S3_REGION }}
          GBACKUP_RECEIPT_S3_BUCKET: ${{ secrets.GBACKUP_RECEIPT_S3_BUCKET }}
          PUBLISH_EVIDENCE_FILE: ${{ github.workspace }}/publish-out/evidence.json
        run: |
          mkdir -p publish-out
          npx tsx scripts/ci/publish-receipt.ts

      - name: Assert no credential material in the evidence
        if: inputs.receipt_mode == 'sign-and-publish'
        run: |
          if grep -rliE "SECRET|ACCESS_KEY|PRIVATE KEY|AWS_SECRET" publish-out 2>/dev/null | grep -qz .; then
            echo "::error::credential material found in publication evidence"; exit 1
          fi
          echo "evidence is free of credential material"

      - name: Upload sanitized publication evidence (public material only)
        if: inputs.receipt_mode == 'sign-and-publish'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: staging-publish-evidence
          path: publish-out/evidence.json
          if-no-files-found: error
          retention-days: 7
